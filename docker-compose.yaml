name: auth-service

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-document-auth
    restart: always

    environment:
      POSTGRES_DB: document_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Bao1234567890@
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # (Tuỳ chọn) Bật khi muốn chạy auth-service bên trong Docker container
  # auth-service:
  #   build: .
  #   container_name: auth-service
  #   restart: unless-stopped
  #   depends_on:
  #     - postgres
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/document_management
  #     SPRING_DATASOURCE_USERNAME: postgres
  #     SPRING_DATASOURCE_PASSWORD: Bao1234567890@

volumes:
  postgres_data:
